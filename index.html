<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maborai</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand">
      <img id="logo-img" src="logo-dark.png" alt="Maborai">
      <span class="brand-name">Maborai</span>
    </a>

    <div class="header-icons">
      <button class="icon-btn" id="theme-toggle" title="تغییر تم" aria-label="تغییر تم">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
      <button class="icon-btn" id="search-toggle" title="جستجو" aria-label="جستجو">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <a href="new.html" class="icon-btn" title="ایجاد پست" aria-label="ایجاد پست">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </a>
    </div>
  </header>

  <div class="search-bar hidden" id="search-bar">
    <input type="text" id="search-input" placeholder="جستجو در پست‌ها…" autocomplete="off">
    <input type="date" id="date-filter" title="فیلتر تاریخ">
  </div>

  <main class="post-list" id="post-list"></main>

  <p class="empty-state" id="empty-state" hidden>پستی پیدا نشد.</p>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Maborai</title>
<link rel="stylesheet" href="/style.css">

<!-- apply theme immediately to prevent flash -->
<script>
  (function(){
    var t = localStorage.getItem('theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

  <main class="error-page">
    <svg class="error-illustration" viewBox="0 0 320 140" fill="none" xmlns="http://www.w3.org/2000/svg">
      <text x="160" y="110" text-anchor="middle" font-family="'GFS Didot', serif" font-size="120" font-weight="700" fill="none" stroke="currentColor" stroke-width="2" opacity="0.35">404</text>
    </svg>

    <p class="error-title">صفحه‌ای که دنبالش بودی پیدا نشد!</p>
    <a href="/" class="error-home-btn">بازگشت به صفحه اصلی</a>
  </main>

</body>
</html>

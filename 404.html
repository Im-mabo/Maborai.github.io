<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Maborai</title>
<link rel="stylesheet" href="/style.css">

<!-- apply theme immediately to prevent flash -->
<script>
  (function(){
    var t = localStorage.getItem('theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

  <header class="site-header">
    <a href="/" class="brand">
      <img id="logo-img" src="/logo-dark.png" alt="Maborai">
      <span class="brand-name">Maborai / error 404</span>
    </a>

    <div class="header-icons">
      <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </header>

  <main class="error-page">
    <svg class="error-illustration" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <text x="160" y="130" text-anchor="middle" font-family="'GFS Didot', serif" font-size="110" font-weight="700" fill="none" stroke="currentColor" stroke-width="2" opacity="0.15">404</text>
      <circle cx="160" cy="100" r="46" stroke="currentColor" stroke-width="2.5" opacity="0.5"/>
      <line x1="192" y1="132" x2="230" y2="170" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="140" y1="82" x2="180" y2="118" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="180" y1="82" x2="140" y2="118" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    </svg>

    <p class="error-title">صفحه‌ای که دنبالش بودی پیدا نشد</p>
    <a href="/" class="error-home-btn">بازگشت به صفحه اصلی</a>
  </main>

  <script>
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const root = document.documentElement;
      const current = root.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      document.getElementById('logo-img').src = next === 'dark' ? '/logo-dark.png' : '/logo-light.png';
      localStorage.setItem('theme', next);
    });
  </script>

</body>
</html>

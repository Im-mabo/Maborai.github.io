<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پست جدید — Maborai</title>
<link rel="stylesheet" href="../style.css">
<script>
  (function(){
    var t = localStorage.getItem('theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  /* ── Editor page layout ── */
  .editor-wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 120px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .editor-page-title {
    font-family: var(--font-fa);
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    color: var(--text);
  }

  /* ── Field groups ── */
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field-label {
    font-family: var(--font-fa);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
  }

  .field-label .optional {
    font-weight: 400;
    color: var(--text-faint);
    margin-right: 4px;
  }

  .field-label .required {
    color: var(--text);
    margin-right: 2px;
  }

  .field-input {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: var(--radius);
    font-family: var(--font-fa);
    font-size: 15px;
    outline: none;
    transition: border-color .15s ease;
    width: 100%;
    box-sizing: border-box;
  }
  .field-input:focus { border-color: var(--text-dim); }
  .field-input::placeholder { color: var(--text-faint); }

  /* ── Toolbar ── */
  .editor-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 8px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: var(--radius) var(--radius) 0 0;
  }

  .tb-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    border-radius: var(--radius);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font-en);
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
    flex-shrink: 0;
  }
  .tb-btn:hover { background: var(--border); color: var(--text); }
  .tb-btn.active { background: var(--border); color: var(--text); }
  .tb-btn svg { width: 15px; height: 15px; pointer-events: none; }

  .tb-sep {
    width: 1px;
    height: 24px;
    background: var(--border);
    align-self: center;
    margin: 0 2px;
  }

  .tb-color-wrap {
    position: relative;
    width: 32px;
    height: 32px;
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tb-color-wrap:hover { background: var(--border); }
  .tb-color-input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .tb-color-icon {
    pointer-events: none;
    font-size: 15px;
    line-height: 1;
    color: var(--text-dim);
    font-family: var(--font-en);
    font-weight: 700;
  }

  /* highlight */
  .tb-highlight-wrap {
    position: relative;
    width: 32px;
    height: 32px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tb-highlight-wrap:hover { background: var(--border); }
  .tb-highlight-input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .tb-highlight-icon {
    pointer-events: none;
    font-size: 13px;
    color: var(--text-dim);
    font-family: var(--font-en);
    font-weight: 700;
    background: #ffe066;
    padding: 1px 3px;
    border-radius: 2px;
  }

  /* ── Editable area ── */
  .editor-body {
    min-height: 260px;
    max-height: 520px;
    overflow-y: auto;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 16px;
    font-family: var(--font-fa);
    font-size: 15px;
    line-height: 1.9;
    color: var(--text);
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .editor-body:empty::before {
    content: attr(data-placeholder);
    color: var(--text-faint);
    pointer-events: none;
  }
  .editor-body img,
  .editor-body video,
  .editor-body iframe {
    max-width: 100%;
    border-radius: var(--radius);
    margin: 8px 0;
    display: block;
  }
  .editor-body blockquote {
    border-right: 3px solid var(--text-faint);
    margin: 8px 0;
    padding: 4px 14px;
    color: var(--text-dim);
    font-style: italic;
  }
  .editor-body pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family: monospace;
    font-size: 13px;
    overflow-x: auto;
    white-space: pre;
    margin: 8px 0;
  }
  .editor-body a { text-decoration: underline; text-underline-offset: 2px; }

  /* char counter */
  .char-counter {
    font-family: var(--font-fa);
    font-size: 12px;
    color: var(--text-faint);
    text-align: left;
    margin-top: 4px;
  }
  .char-counter.warn { color: #e07b39; }
  .char-counter.over { color: #e03939; }

  /* ── Modal (link / media / embed) ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .modal-overlay.hidden { display: none; }

  .modal {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) * 2);
    padding: 24px;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-title {
    font-family: var(--font-fa);
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    color: var(--text);
  }

  .modal-input {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: var(--radius);
    font-family: var(--font-fa);
    font-size: 14px;
    outline: none;
    width: 100%;
    box-sizing: border-box;
  }
  .modal-input:focus { border-color: var(--text-dim); }
  .modal-input::placeholder { color: var(--text-faint); }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .btn-cancel {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 18px;
    border-radius: var(--radius);
    font-family: var(--font-fa);
    font-size: 13px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .btn-cancel:hover { background: var(--bg-raised); }

  .btn-insert {
    background: var(--text);
    border: 1px solid var(--text);
    color: var(--bg);
    padding: 8px 18px;
    border-radius: var(--radius);
    font-family: var(--font-fa);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .12s ease;
  }
  .btn-insert:hover { opacity: .85; }

  /* ── Bypass code row ── */
  .bypass-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .bypass-row .field-input {
    flex: 1;
  }

  /* ── Submit button ── */
  .btn-submit {
    align-self: flex-start;
    background: var(--text);
    border: none;
    color: var(--bg);
    padding: 11px 28px;
    border-radius: 999px;
    font-family: var(--font-fa);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-submit:hover { opacity: .85; }
  .btn-submit:disabled { opacity: .45; cursor: default; }

  .submit-spinner {
    width: 16px;
    height: 16px;
    border: 2px solid transparent;
    border-top-color: var(--bg);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    display: none;
  }
  .btn-submit.loading .submit-spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    padding: 12px 22px;
    border-radius: 999px;
    font-family: var(--font-fa);
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error {
    background: #e03939;
    color: #fff;
  }

  @media (max-width: 640px) {
    .editor-wrap { padding: 24px 16px 100px; }
    .btn-submit { width: 100%; justify-content: center; }
  }
</style>
</head>

  <script>
  /* ── Theme ── */
  const root = document.documentElement;
  const logoImg = document.getElementById('logo-img');
  const themeToggle = document.getElementById('theme-toggle');

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    logoImg.src = theme === 'dark' ? '../logo-dark.png' : '../logo-light.png';
    localStorage.setItem('theme', theme);
  }
  applyTheme(root.getAttribute('data-theme'));
  themeToggle.addEventListener('click', () => {
    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ── Editor ── */
  const editor = document.getElementById('editor-body');
  const charCounter = document.getElementById('char-counter');
  const WORKER_URL = 'https://maborai-api.muse-niiik.workers.dev/';

  // Media/embed = 10 chars each
  const MEDIA_WEIGHT = 10;

  function getEditorText() {
    // plain text from editor
    return editor.innerText || '';
  }

  function countChars() {
    let count = 0;
    // Count text nodes
    count += getEditorText().length;
    // Count media elements (img, video, iframe) each as 10
    const mediaEls = editor.querySelectorAll('img, video, iframe');
    count += mediaEls.length * MEDIA_WEIGHT;
    // Subtract real length of media placeholders (they don't have text but innerText might count newlines)
    // Actually innerText includes newlines from block elements so subtract those extra
    return count;
  }

  function updateCounter() {
    const raw = getEditorText().replace(/\n/g, '').length;
    const mediaCount = editor.querySelectorAll('img, video, iframe').length * MEDIA_WEIGHT;
    const total = raw + mediaCount;

    const toFarsi = n => n.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    charCounter.textContent = `${toFarsi(total)} / ۱۰۰۰`;
    charCounter.className = 'char-counter' + (total > 1000 ? ' over' : total > 800 ? ' warn' : '');
  }

  editor.addEventListener('input', updateCounter);

  /* ── Toolbar commands ── */
  document.querySelectorAll('[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', e => {
      e.preventDefault();
      document.execCommand(btn.dataset.cmd, false, null);
      editor.focus();
    });
  });

  // Quote
  document.getElementById('btn-quote').addEventListener('mousedown', e => {
    e.preventDefault();
    document.execCommand('formatBlock', false, 'blockquote');
    editor.focus();
  });

  // Code block
  document.getElementById('btn-code').addEventListener('mousedown', e => {
    e.preventDefault();
    document.execCommand('formatBlock', false, 'pre');
    editor.focus();
  });

  // Text color
  document.getElementById('tb-text-color').addEventListener('input', function() {
    document.execCommand('foreColor', false, this.value);
    editor.focus();
  });

  // Highlight
  document.getElementById('tb-highlight-color').addEventListener('input', function() {
    document.execCommand('hiliteColor', false, this.value);
    editor.focus();
  });

  /* ── Saved selection for modals ── */
  let savedRange = null;
  function saveSelection() {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) savedRange = sel.getRangeAt(0).cloneRange();
  }
  function restoreSelection() {
    if (!savedRange) return;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }

  editor.addEventListener('mouseup', saveSelection);
  editor.addEventListener('keyup', saveSelection);

  /* ── Modal helpers ── */
  function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

  /* ── Link modal ── */
  document.getElementById('btn-link').addEventListener('click', () => {
    saveSelection();
    document.getElementById('link-url').value = '';
    openModal('modal-link');
    setTimeout(() => document.getElementById('link-url').focus(), 50);
  });
  document.getElementById('link-cancel').addEventListener('click', () => closeModal('modal-link'));
  document.getElementById('link-insert').addEventListener('click', () => {
    const url = document.getElementById('link-url').value.trim();
    if (!url) return;
    restoreSelection();
    document.execCommand('createLink', false, url);
    // make links open in new tab
    editor.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    closeModal('modal-link');
    updateCounter();
  });

  /* ── Image modal ── */
  document.getElementById('btn-image').addEventListener('click', () => {
    saveSelection();
    document.getElementById('image-url').value = '';
    document.getElementById('image-link').value = '';
    openModal('modal-image');
    setTimeout(() => document.getElementById('image-url').focus(), 50);
  });
  document.getElementById('image-cancel').addEventListener('click', () => closeModal('modal-image'));
  document.getElementById('image-insert').addEventListener('click', () => {
    const src = document.getElementById('image-url').value.trim();
    const href = document.getElementById('image-link').value.trim();
    if (!src) return;
    restoreSelection();
    let html = `<img src="${escAttr(src)}" alt="" loading="lazy">`;
    if (href) html = `<a href="${escAttr(href)}" target="_blank" rel="noopener">${html}</a>`;
    document.execCommand('insertHTML', false, html + '<br>');
    closeModal('modal-image');
    updateCounter();
  });

  /* ── Video modal ── */
  document.getElementById('btn-video').addEventListener('click', () => {
    saveSelection();
    document.getElementById('video-url').value = '';
    openModal('modal-video');
    setTimeout(() => document.getElementById('video-url').focus(), 50);
  });
  document.getElementById('video-cancel').addEventListener('click', () => closeModal('modal-video'));
  document.getElementById('video-insert').addEventListener('click', () => {
    const src = document.getElementById('video-url').value.trim();
    if (!src) return;
    restoreSelection();
    document.execCommand('insertHTML', false,
      `<video src="${escAttr(src)}" controls playsinline style="max-width:100%;border-radius:4px;margin:8px 0"></video><br>`);
    closeModal('modal-video');
    updateCounter();
  });

  /* ── Embed modal ── */
  document.getElementById('btn-embed').addEventListener('click', () => {
    saveSelection();
    document.getElementById('embed-url').value = '';
    openModal('modal-embed');
    setTimeout(() => document.getElementById('embed-url').focus(), 50);
  });
  document.getElementById('embed-cancel').addEventListener('click', () => closeModal('modal-embed'));
  document.getElementById('embed-insert').addEventListener('click', () => {
    const url = document.getElementById('embed-url').value.trim();
    if (!url) return;
    const iframe = buildEmbed(url);
    if (!iframe) { showToast('لینک پشتیبانی نمی‌شود.', true); return; }
    restoreSelection();
    document.execCommand('insertHTML', false, iframe + '<br>');
    closeModal('modal-embed');
    updateCounter();
  });

  function buildEmbed(url) {
    // YouTube
    let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if (m) return `<iframe width="100%" height="315" src="https://www.youtube.com/embed/${m[1]}" frameborder="0" allowfullscreen style="border-radius:4px;margin:8px 0;display:block"></iframe>`;
    // Spotify track/album/playlist
    m = url.match(/open\.spotify\.com\/(track|album|playlist|episode)\/([A-Za-z0-9]+)/);
    if (m) return `<iframe src="https://open.spotify.com/embed/${m[1]}/${m[2]}" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" style="border-radius:12px;margin:8px 0;display:block"></iframe>`;
    // SoundCloud
    if (url.includes('soundcloud.com')) return `<iframe width="100%" height="166" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23ff5500" frameborder="0" style="margin:8px 0;display:block"></iframe>`;
    // Generic iframe fallback
    return `<iframe src="${escAttr(url)}" width="100%" height="315" frameborder="0" allowfullscreen style="border-radius:4px;margin:8px 0;display:block"></iframe>`;
  }

  /* ── Close modals on overlay click ── */
  ['modal-link','modal-image','modal-video','modal-embed'].forEach(id => {
    document.getElementById(id).addEventListener('click', function(e) {
      if (e.target === this) closeModal(id);
    });
  });

  /* ── Toast ── */
  let toastTimer;
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 3500);
  }

  /* ── Submit ── */
  document.getElementById('btn-submit').addEventListener('click', async () => {
    const title      = document.getElementById('f-title').value.trim();
    const banner     = document.getElementById('f-banner').value.trim();
    const authorName = document.getElementById('f-author').value.trim();
    const authorAvatar = document.getElementById('f-avatar').value.trim();
    const bypassCode = document.getElementById('f-bypass').value.trim();
    const content    = editor.innerHTML.trim();
    const plainText  = getEditorText().replace(/\n/g, '').length;
    const mediaCount = editor.querySelectorAll('img, video, iframe').length * MEDIA_WEIGHT;
    const totalChars = plainText + mediaCount;

    if (!title)       { showToast('عنوان مطلب را وارد کنید.', true); return; }
    if (!authorName)  { showToast('اسم نویسنده را وارد کنید.', true); return; }
    if (plainText < 100) { showToast('متن مطلب باید حداقل ۱۰۰ کاراکتر باشد.', true); return; }
    if (totalChars > 1000) { showToast('متن مطلب از ۱۰۰۰ کاراکتر بیشتر است.', true); return; }

    const btn = document.getElementById('btn-submit');
    const lbl = document.getElementById('btn-label');
    btn.disabled = true;
    btn.classList.add('loading');
    lbl.textContent = 'در حال ارسال…';

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title,
          banner,
          content,
          authorName,
          authorAvatar,
          bypassCode: bypassCode || undefined,
          date: new Date().toISOString().slice(0, 10),
        }),
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'خطای ناشناخته');

      if (data.published) {
        showToast('پست منتشر شد! 🎉');
      } else {
        showToast('پست ارسال شد و منتظر بررسی است.');
      }

      // Reset form
      setTimeout(() => {
        document.getElementById('f-title').value = '';
        document.getElementById('f-banner').value = '';
        document.getElementById('f-author').value = '';
        document.getElementById('f-avatar').value = '';
        document.getElementById('f-bypass').value = '';
        editor.innerHTML = '';
        updateCounter();
      }, 1500);

    } catch (err) {
      showToast('خطا: ' + err.message, true);
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
      lbl.textContent = 'ارسال پست';
    }
  });

  /* ── Helpers ── */
  function escAttr(s) {
    return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  </script>
</body>
</html>
